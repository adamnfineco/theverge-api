[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "theverge-api"
version = "0.2.0"
description = "Unofficial Python client for The Verge — feed, articles, newsletters, authors."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["httpx>=0.24.0"]
keywords = ["theverge", "rss", "news", "api", "client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/adamnfineco/theverge-api"
Issues   = "https://github.com/adamnfineco/theverge-api/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: hits the real Verge website (run with -m integration)",
]

[tool.hatch.build.targets.wheel]
packages = ["theverge"]

[tool.ruff]
line-length = 100
target-version = "py39"
